[package]
name = "tracks"
edition = "2021"
version = "0.1.0"

[dependencies]
geo = "0.32.0"
# needed by geo, the js feature enable the geo wasm build 
getrandom = { version = "0.2", features = ["js"] }
gpx = "0.10.0"
kd-tree = "0.6.0"
proj4rs = "0.1.5"
svg = "0.18.0"
tempfile = "3.19.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"
serde_with = "3.20.0"
reqwest = {version="0.12.23",default-features = false,features = ["gzip", "deflate","rustls-tls"] }
tokio-util = { version = "0.7" }
urlencoding = "2.1.3"
dirs = "6.0.0"
tokio = {version="1.47.1", features=["rt","macros"]}
anyhow = "1.0.99"
log = "0.4.28"
env_logger = "0.11.8"
sphere-knn = "0.1.0"
rstar = "0.12.2"
wasm-bindgen = "0.2.104"
euclid = "0.22.11"
regex = "1.12.2"
# https://github.com/zip-rs/zip2/issues/176
zip = {version="8.4.0",default-features = false }
thiserror = "2.0.18"
# pdf rendering
svg2pdf = "0.12"
indexed_db_futures = "0.6.4"
pdf-writer = "0.12.1"
wasmtimer = "0.4.3"

[dependencies.web-sys]
version = "0.3"
features = ["DomException","Location","Window"]


#[features]
# default = ["typstpdf"]
#typstpdf = ["dep:typst-as-lib","dep:typst-pdf"]
		  















